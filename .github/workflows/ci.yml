name: kilo-factory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: CLI smoke test
        run: |
          bun dist/cli.js --version
          bun dist/cli.js --help

      - name: Live acceptance status
        run: |
          echo "=== Live Kilo acceptance ==="
          if [ -n "$KILO_E2E_SEED_SESSION_ID" ]; then
            KILO_E2E_SEED_SESSION_ID=$KILO_E2E_SEED_SESSION_ID bun test test/e2e/ test/fresh/ test/release/ test/selfhost/ test/recovery/crash-restart.test.ts
            echo "RESULT: PASS"
          else
            echo "RESULT: SKIPPED-EXTERNAL (no KILO_E2E_SEED_SESSION_ID)"
          fi
        continue-on-error: true
